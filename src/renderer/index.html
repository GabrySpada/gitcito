<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>gitcito</title>
    <link rel="icon" type="image/png" href="./src/assets/logo.png" />

    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
